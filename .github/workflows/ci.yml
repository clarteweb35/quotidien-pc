name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['engine/**', 'config/**', 'site/**', 'package*.json']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node engine/src/cli.js check-config
      - run: npm test
      - name: Journée simulée (faux Gemini, aucune publication)
        run: node engine/src/cli.js simulate
      - run: npm run site:build
        env:
          SITE_URL: https://example.com
