name: Rédaction automatique

# Exécute le moteur éditorial. Le cron GitHub peut avoir du retard (parfois plusieurs minutes) ou sauter
# une exécution en période de charge : le moteur rattrape les créneaux manqués dans la limite configurée.
on:
  schedule:
    # 5h-21h UTC = 6h/7h à 22h/23h à Paris selon la saison. Minutes décalées pour éviter l'heure pile (congestion).
    - cron: '7,37 5-21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode d''exécution'
        type: choice
        default: normal
        options: [normal, extra, dry-run, force-catchup]
      count:
        description: 'Nombre d''articles à publier (mode extra uniquement, dans la limite de 5 par jour)'
        type: choice
        default: '1'
        options: ['1', '2', '3', '4', '5']
      spacing:
        description: 'Minutes d''attente entre deux articles (mode extra uniquement)'
        type: choice
        default: '0'
        options: ['0', '2', '3', '4', '5']

# Un seul cycle à la fois, sans jamais en annuler un en cours (verrou contre les exécutions simultanées).
concurrency:
  group: editor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Toujours la pointe de la branche: un « Re-run » GitHub rejouerait sinon l'ancien commit (ancien état => créneaux déjà pris ignorés).
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier la configuration
        run: node engine/src/cli.js check-config

      - name: Exécuter le moteur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_QPC || secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          COUNT: ${{ inputs.count }}
          SPACING: ${{ inputs.spacing }}
        run: |
          args=""
          case "$MODE" in
            extra) args="--extra --count ${COUNT:-1} --spacing ${SPACING:-0}" ;;
            dry-run) args="--dry-run" ;;
            force-catchup) args="--force-catchup" ;;
          esac
          node engine/src/cli.js run $args

      - name: Enregistrer les résultats (commit)
        id: commit
        # Meme si le moteur s'arrete en erreur, les articles deja publies pendant ce lancement ne doivent pas etre perdus.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "quotidien-pc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/src/content/articles site/src/data site/public/images
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --cached --name-only -- site/src/content/articles site/src/data | grep -q .; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "editor: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          # Rien ne doit se perdre: le travail est sauvegardé sur une branche de secours, à examiner à la main.
          git push origin "HEAD:refs/heads/editor-recovery-${GITHUB_RUN_ID}" || true
          echo "Échec de l'enregistrement sur ${GITHUB_REF_NAME}; travail sauvegardé sur la branche editor-recovery-${GITHUB_RUN_ID}" >&2
          exit 1

      - name: Alertes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          node engine/src/cli.js alerts --out alert.md
          code=$?
          if [ "$JOB_STATUS" != "success" ]; then
            echo "- Le workflow a échoué : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> alert.md
            code=3
          fi
          if [ "$code" = "3" ]; then
            gh label create alerte-moteur --color B60205 --description "Alerte du moteur éditorial" 2>/dev/null
            n=$(gh issue list --label alerte-moteur --state open --json number --jq '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body-file alert.md
            else gh issue create --title "Alerte du moteur éditorial" --label alerte-moteur --body-file alert.md; fi
          fi

  deploy:
    needs: engine
    if: ${{ !cancelled() && needs.engine.outputs.published == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
